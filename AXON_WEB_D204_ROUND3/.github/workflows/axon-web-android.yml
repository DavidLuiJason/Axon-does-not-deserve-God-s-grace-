name: AXON Web — reproducible Android build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'android-overlay/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.nvmrc'
      - 'BUILD.md'
      - '.github/workflows/axon-web-android.yml'

permissions:
  contents: read

concurrency:
  group: axon-web-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35 SDK packages
        run: sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Record toolchain
        run: |
          node --version
          npm --version
          java -version
          sdkmanager --list_installed

      - name: Install locked JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web bundle
        run: npm run build

      - name: Type-check source
        run: npm run lint

      - name: Run complete TypeScript test set
        run: npm run test:all

      - name: Verify Android overlay insertion/idempotence
        run: python3 tests/browserOverlayApply.test.py

      - name: Generate, sync, compile Java and assemble APK
        run: bash scripts/build-axon-web-android.sh

      - name: Upload APK and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: axon-web-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            artifacts/android-build-report.txt
          if-no-files-found: error
          retention-days: 30
